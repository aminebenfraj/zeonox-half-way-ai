<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <title>API Keys — Zenox</title>
  <style>
    :root {
      color-scheme: dark; --bg:#09090b; --card:#18181b; --border:#27272a;
      --text:#fafafa; --muted:#a1a1aa; --primary:#6366f1; --success:#22c55e;
      --warning:#f59e0b; --danger:#ef4444;
    }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:14px/1.5 Inter,system-ui,sans-serif; }
    main { width:min(1040px,100%); margin:auto; padding:28px 18px 56px; }
    .top { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; margin-bottom:24px; }
    h1 { margin:5px 0 4px; font-size:28px; }
    p { margin:0; color:var(--muted); }
    a,button { min-height:42px; border:1px solid var(--border); border-radius:9px; padding:10px 14px; color:var(--text); background:#202024; text-decoration:none; cursor:pointer; font-weight:650; }
    button.primary { background:var(--primary); border-color:var(--primary); }
    button:disabled { opacity:.55; cursor:default; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; }
    .notice { border:1px solid rgba(99,102,241,.35); background:rgba(99,102,241,.09); border-radius:12px; padding:12px 14px; margin-bottom:18px; color:#c7d2fe; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; }
    .card { position:relative; overflow:hidden; border:1px solid var(--border); border-radius:14px; background:var(--card); padding:17px; }
    .card::before { content:""; position:absolute; inset:0 auto 0 0; width:3px; background:var(--muted); }
    .card.ready::before { background:var(--success); }.card.cooldown::before { background:var(--warning); }
    .card.error::before,.card.not_configured::before { background:var(--danger); }
    .head { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    h2 { margin:0; font-size:17px; }
    .pill { padding:3px 8px; border:1px solid var(--border); border-radius:999px; color:var(--muted); font-size:10px; text-transform:uppercase; font-weight:800; }
    .meta { color:var(--muted); font-size:12px; margin:9px 0 14px; min-height:54px; }
    code { color:var(--text); }
    label { display:block; margin-bottom:6px; color:var(--muted); font-size:12px; font-weight:700; }
    .input-row { display:flex; gap:7px; }
    input { min-width:0; flex:1; border:1px solid var(--border); border-radius:9px; background:#0f0f12; color:var(--text); padding:10px 11px; }
    .reveal { min-width:48px; padding:8px; }
    .save { width:100%; margin-top:9px; background:var(--primary); border-color:var(--primary); }
    .message { min-height:20px; margin-top:8px; color:var(--muted); font-size:12px; }
    .message.ok { color:var(--success); }.message.bad { color:var(--danger); }
    @media(max-width:620px){ main{padding-top:18px}.top{flex-direction:column}.actions{width:100%}.actions>*{flex:1;text-align:center} }
    /* Native shadcn-style tokens and component composition. */
    :root { --bg:#09090b; --card:#18181b; --border:#27272a; --primary:#6366f1; }
    body { background:#09090b; padding:8px; }
    main { min-height:calc(100vh - 16px); border:1px solid var(--border); border-radius:12px; background:var(--bg); padding:32px clamp(18px,4vw,46px) 60px; }
    .top { margin-bottom:26px; }
    h1 { font-size:24px; letter-spacing:-.035em; }
    a,button { border-radius:7px; background:#18181b; }
    button.primary,.save { background:var(--primary); border-color:var(--primary); color:#fafafa; }
    .notice { border-color:var(--border); background:#18181b; color:#d4d4d8; }
    .grid { grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px; }
    .card { border-radius:10px; padding:17px; }
    .card::before { width:2px; }
    input { border-radius:7px; }
    button:hover:not(:disabled),a:hover { filter:brightness(1.1); }
    @media(max-width:620px){body{padding:0}main{min-height:100vh;border:0;border-radius:0}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <div class="top">
    <div><p>Zenox settings</p><h1>API Keys</h1><p>Manage every AI provider used by the web app.</p></div>
    <div class="actions"><a href="/">← Approval Queue</a><a href="/bots">Bots</a><button class="primary" id="checkBtn" onclick="checkAll()">Check all</button></div>
  </div>
  <div class="notice">Existing keys stay masked. Enter a replacement and press Save; the new key is written to the ignored <code>.env</code> file and becomes active immediately.</div>
  <div class="grid" id="providerGrid"><div class="card">Loading providers…</div></div>
</main>
<script>
const escapeHtml = value => String(value || "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
const stateLabels = {ready:"Ready",cooldown:"Cooldown",error:"Error",not_configured:"Not configured",unchecked:"Not checked"};
let providers = [];

function render() {
  document.getElementById("providerGrid").innerHTML = providers.map(item => `
    <section class="card ${escapeHtml(item.state)}" data-provider="${escapeHtml(item.provider)}">
      <div class="head"><h2>${escapeHtml(item.label)}</h2><span class="pill">${escapeHtml(stateLabels[item.state] || item.state)}</span></div>
      <div class="meta">
        ${escapeHtml(item.purpose || "AI provider")}<br>
        Key: <code>${escapeHtml(item.key_hint || "not configured")}</code><br>
        Model: ${escapeHtml(item.model || "default")}<br>
        ${escapeHtml(item.detail || (item.checked_at ? "Last check completed" : "No live check yet"))}
      </div>
      <label for="key-${escapeHtml(item.provider)}">Replace API key</label>
      <div class="input-row">
        <input id="key-${escapeHtml(item.provider)}" type="password" autocomplete="off" placeholder="Paste new ${escapeHtml(item.label)} key" />
        <button class="reveal" type="button" onclick="toggleReveal('${escapeHtml(item.provider)}', this)">Show</button>
      </div>
      <button class="save" onclick="saveKey('${escapeHtml(item.provider)}', this)">Save new key</button>
      <div class="message" id="msg-${escapeHtml(item.provider)}"></div>
    </section>`).join("");
}

async function load() {
  const response = await fetch("/api/ai-keys/status");
  providers = await response.json();
  render();
}

function toggleReveal(provider, button) {
  const input = document.getElementById(`key-${provider}`);
  input.type = input.type === "password" ? "text" : "password";
  button.textContent = input.type === "password" ? "Show" : "Hide";
}

async function saveKey(provider, button) {
  const input = document.getElementById(`key-${provider}`);
  const message = document.getElementById(`msg-${provider}`);
  const key = input.value.trim();
  if (!key) { message.className="message bad"; message.textContent="Paste a replacement key first."; return; }
  button.disabled = true; message.className="message"; message.textContent="Saving…";
  try {
    const response = await fetch(`/api/ai-keys/${provider}`, {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key})});
    const result = await response.json().catch(() => ({}));
    if (!response.ok || !result.ok) throw new Error(result.error || `HTTP ${response.status}`);
    input.value = "";
    const index = providers.findIndex(item => item.provider === provider);
    if (index >= 0) providers[index] = result.provider;
    render();
    const savedMessage = document.getElementById(`msg-${provider}`);
    savedMessage.className="message ok"; savedMessage.textContent="Saved and activated. Run Check all to verify it.";
  } catch (error) { message.className="message bad"; message.textContent=String(error); }
  finally { button.disabled = false; }
}

async function checkAll() {
  const button = document.getElementById("checkBtn"); button.disabled=true; button.textContent="Checking…";
  try {
    const response = await fetch("/api/ai-keys/check", {method:"POST"});
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
    providers = result.providers || []; render();
  } catch (error) { window.alert(`Check failed: ${error}`); }
  finally { button.disabled=false; button.textContent="Check all"; }
}
load().catch(error => { document.getElementById("providerGrid").textContent = `Could not load API keys: ${error}`; });
</script>
</body>
</html>
